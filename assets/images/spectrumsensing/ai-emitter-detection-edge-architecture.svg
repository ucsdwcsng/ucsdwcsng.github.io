<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AI-enabled real-time RF emitter detection on edge compute</title>
  <desc id="desc">A wideband RF sensing pipeline moves samples from an RF front end through a slot-synchronous transport layer to edge compute, where multiple AI detectors are fused into an occupancy map and an adaptive sensing policy.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eaf7f7"/>
      <stop offset="1" stop-color="#e0f0f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#13324b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26779b"/>
    </marker>
    <style>
      .heading { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102f52; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102f52; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #29445a; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #557188; }
      .detector { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #145d62; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>

  <text x="42" y="46" class="heading">Wideband RF sensing to real-time edge intelligence</text>
  <text x="42" y="72" class="body">An illustrative architecture for the planned emitter-detection pipeline</text>

  <g filter="url(#shadow)">
    <rect x="42" y="112" width="210" height="190" rx="16" fill="url(#panel)" stroke="#2f78a7" stroke-width="2"/>
    <text x="62" y="146" class="label">RF front end</text>
    <text x="62" y="169" class="small">Direct RF sampling</text>
    <rect x="62" y="188" width="72" height="30" rx="7" fill="#ffffff" stroke="#b1c5d5"/>
    <rect x="160" y="188" width="72" height="30" rx="7" fill="#ffffff" stroke="#b1c5d5"/>
    <text x="79" y="208" class="body">RX 0–3</text>
    <text x="170" y="208" class="body">NCO + DDC</text>
    <path d="M134 203 H160" stroke="#26779b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="62" y="252" class="body">Multiple synchronized</text>
    <text x="62" y="274" class="body">IQ streams</text>
  </g>

  <path d="M252 207 H318" stroke="#26779b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="258" y="188" class="small">100 GbE fronthaul</text>

  <g filter="url(#shadow)">
    <rect x="318" y="112" width="250" height="190" rx="16" fill="url(#panel)" stroke="#2f78a7" stroke-width="2"/>
    <text x="340" y="146" class="label">Slot-synchronous transport</text>
    <text x="340" y="174" class="body">Slot ticks</text>
    <text x="340" y="200" class="body">Channelizer and buffering</text>
    <text x="340" y="226" class="body">Deterministic control path</text>
    <text x="340" y="269" class="small">RadioStream provides a timing-aware</text>
    <text x="340" y="288" class="small">RFSoC-to-host foundation.</text>
  </g>

  <path d="M568 207 H634" stroke="#26779b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="634" y="94" width="524" height="350" rx="18" fill="url(#edge)" stroke="#23828a" stroke-width="2"/>
    <text x="660" y="132" class="label">Edge compute and AI detection</text>
    <text x="660" y="155" class="small">Low-latency processing close to the sensor</text>

    <rect x="660" y="182" width="145" height="108" rx="12" fill="#ffffff" stroke="#62a9a7"/>
    <text x="678" y="210" class="detector">Decoder bank</text>
    <text x="678" y="235" class="small">Protocol sync</text>
    <text x="678" y="254" class="small">and decode</text>
    <text x="678" y="276" class="small">Self-supervised labels</text>

    <rect x="825" y="182" width="145" height="108" rx="12" fill="#ffffff" stroke="#62a9a7"/>
    <text x="843" y="210" class="detector">Physics-guided AI</text>
    <text x="843" y="235" class="small">Energy priors</text>
    <text x="843" y="254" class="small">and learned features</text>
    <text x="843" y="276" class="small">Calibrated confidence</text>

    <rect x="990" y="182" width="145" height="108" rx="12" fill="#ffffff" stroke="#62a9a7"/>
    <text x="1008" y="210" class="detector">Below-floor DSSS</text>
    <text x="1008" y="235" class="small">Cyclostationary</text>
    <text x="1008" y="254" class="small">features and ML</text>
    <text x="1008" y="276" class="small">Low-SNR detection</text>

    <path d="M732 290 V326 H894" stroke="#23828a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M897 290 V326" stroke="#23828a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1062 290 V326 H932" stroke="#23828a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="822" y="326" width="145" height="52" rx="12" fill="#d1eeee" stroke="#23828a"/>
    <text x="855" y="349" class="detector">Fusion</text>
    <text x="838" y="367" class="small">Joint detection map</text>
  </g>

  <path d="M896 444 V500" stroke="#26779b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="634" y="500" width="250" height="94" rx="16" fill="#fff8e9" stroke="#d89a35" stroke-width="2"/>
    <text x="658" y="533" class="label">Sensing outputs</text>
    <text x="658" y="559" class="body">Occupancy map and alerts</text>
    <text x="658" y="580" class="small">Detection confidence, latency, throughput</text>

    <rect x="910" y="500" width="248" height="94" rx="16" fill="#f2ecff" stroke="#8064b5" stroke-width="2"/>
    <text x="934" y="533" class="label">Adaptive sensing policy</text>
    <text x="934" y="559" class="body">Choose where and how to listen</text>
    <text x="934" y="580" class="small">Steer center frequency and bandwidth</text>
  </g>

  <path d="M910 547 H884" stroke="#8064b5" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1034 500 V444" stroke="#8064b5" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="1060" y="474" class="small">Closed loop</text>
</svg>
